# FindEat — CI(검사) + CD(main push 시 테스트 서버 배포)
# CD는 저장소에 등록된 self-hosted Runner(Windows, C:\dev\FindEat)에서 실행합니다.
# Runner 설치: docs/GITHUB_ACTIONS.md

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (검사)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

  deploy:
    name: CD (테스트 서버 배포)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 15
    env:
      DEPLOY_PATH: C:\dev\FindEat
      PM2_APP_NAME: findeat
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Deploy (pull + install + pm2 restart)
        run: |
          $ErrorActionPreference = 'Stop'
          $path = $env:DEPLOY_PATH
          if (-not (Test-Path $path)) {
            throw "배포 경로가 없습니다: $path (Runner PC에 clone 되어 있어야 합니다)"
          }
          Set-Location $path
          git config --global --add safe.directory $path 2>$null
          git fetch origin main
          git checkout main
          git pull origin main
          npm ci --omit=dev
          $pm2 = Get-Command pm2 -ErrorAction SilentlyContinue
          if (-not $pm2) {
            throw "pm2 명령을 찾을 수 없습니다. 서버에 npm install -g pm2 후 PATH를 확인하세요."
          }
          pm2 restart $env:PM2_APP_NAME
          pm2 status $env:PM2_APP_NAME
