# FindEat — CI(검사) + CD(main push 시 테스트 서버 배포)
# CD는 저장소에 등록된 self-hosted Runner(Windows, C:\dev\FindEat)에서 실행합니다.
# Runner 설치: docs/GITHUB_ACTIONS.md

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (검사)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

  deploy:
    name: CD (테스트 서버 배포)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 15
    env:
      DEPLOY_PATH: C:\dev\FindEat
      PM2_APP_NAME: findeat
    # Windows Server 기본은 Windows PowerShell. pwsh(PowerShell 7)는 없을 수 있음.
    defaults:
      run:
        shell: powershell
    steps:
      - name: Deploy (pull + install + pm2 restart)
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-LastExit([string]$stepName) {
            if ($LASTEXITCODE -ne 0) {
              throw "Step failed: $stepName (exit code=$LASTEXITCODE)"
            }
          }

          Write-Host "=== Runner context ==="
          whoami
          Write-Host "PWD(before): $(Get-Location)"
          $path = $env:DEPLOY_PATH
          if (-not (Test-Path $path)) {
            throw "Deploy path not found: $path. Clone this repository on the runner host first."
          }
          Set-Location $path
          Write-Host "PWD(deploy): $(Get-Location)"
          Write-Host "=== Git pull ==="
          git config --global --add safe.directory $path
          Assert-LastExit "git config safe.directory"
          git fetch origin main
          Assert-LastExit "git fetch origin main"
          git checkout main
          Assert-LastExit "git checkout main"
          git pull origin main
          Assert-LastExit "git pull origin main"
          Write-Host "=== npm install ==="
          npm ci --omit=dev
          Assert-LastExit "npm ci --omit=dev"
          Write-Host "=== pm2 restart ==="
          $pm2 = Get-Command pm2 -ErrorAction SilentlyContinue
          if (-not $pm2) {
            $pm2Cmd = "C:\Users\Administrator\AppData\Roaming\npm\pm2.cmd"
            if (Test-Path $pm2Cmd) {
              & $pm2Cmd restart $env:PM2_APP_NAME
              Assert-LastExit "pm2 restart (fallback path)"
              & $pm2Cmd status $env:PM2_APP_NAME
              Assert-LastExit "pm2 status (fallback path)"
              exit 0
            }
            throw "pm2 command not found in PATH. Set runner service logon account to .\Administrator or install pm2 for the service account."
          }
          pm2 restart $env:PM2_APP_NAME
          Assert-LastExit "pm2 restart"
          pm2 status $env:PM2_APP_NAME
          Assert-LastExit "pm2 status"
