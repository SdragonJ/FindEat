<!doctype html>
<!--
  FindEat_CURSOR — 진입 정적 HTML (마크업 + 스크립트 로드)

  [역할]
  - 브라우저가 / 또는 /index.html 을 요청하면 server.js 의 express.static('public') 이 이 파일을 보냅니다.
  - 목록·폼·화면 전환은 맨 아래 <script src="/app.js"> 가 담당하고, /api/* 는 같은 출처의 Express 서버가 응답합니다.
  - URL은 고정이고, div#viewHome / viewEdit / viewAdd 를 숨김·표시만 바꿉니다.

  [문법 힌트]
  - hidden 속성: CSS display:none 과 비슷하게 요소를 접근성 트리에서도 숨길 때 사용합니다.
  - aria-* / role: 스크린 리더 등 보조 기술을 위한 WAI-ARIA 표준입니다.
-->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FindEat_CURSOR · 회사 주변 맛집</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="wrap">
      <!-- 홈: 점심 추천 + 식당 목록 버튼으로 아래 목록 블록 펼침 -->
      <div id="viewHome" class="view">
        <header class="hero">
          <p class="hero-badge" aria-hidden="true">#맛있는 하루</p>
          <p class="hero-badge" aria-hidden="true">#먹방</p>
          <p class="hero-badge" aria-hidden="true">#회사 주변 맛집</p>
          <p class="hero-badge" aria-hidden="true">
            #먹을 만한 데가 어디 없나?
          </p>
          <h1>FindEat</h1>
          <p class="tagline">즐거운 점심시간, 뭐먹을지 내가 골라줌</p>
        </header>

        <section class="card pick-card">
          <div class="pick-head">
            <h2 class="pick-title">오늘 점심 추천</h2>
            <button
              type="button"
              id="btnPick"
              class="btn primary pick-head-btn"
            >
              추천 받기
            </button>
          </div>
          <div class="pick-stack pick-filters-inset">
            <label class="field-label" for="pickDistance">도보 시간</label>
            <div class="pick-distance-row">
              <select id="pickDistance" class="pick-distance-select">
                <option value="">제한 없음</option>
                <option value="10">10분 미만</option>
                <option value="20">20분 미만</option>
                <option value="30">30분 미만</option>
                <option value="gte30">30분 이상</option>
              </select>
              <label
                class="pick-matjip-toggle toggle-stamp"
                for="pickMatjipOnly"
              >
                <input
                  type="checkbox"
                  id="pickMatjipOnly"
                  class="toggle-stamp__input"
                />
                <span class="toggle-stamp__face">
                  <span class="toggle-stamp__ring" aria-hidden="true"></span>
                  <span class="toggle-stamp__text">맛집</span>
                </span>
              </label>
            </div>
            <p class="field-hint">조건에 맞는 식당 중 하나를 무작위로 골라줘요.</p>
            <label class="field-label" for="pickCat">음식 종류</label>
            <select id="pickCat" class="field-full">
              <option value="">전체에서 골라줘</option>
            </select>
            <label class="field-label" for="pickRating">별점</label>
            <select id="pickRating" class="field-full">
              <option value="">전체 (별점 무관)</option>
              <option value="1">⭐ 1점 이상</option>
              <option value="2">⭐ 2점 이상</option>
              <option value="3">⭐ 3점 이상</option>
              <option value="4">⭐ 4점 이상</option>
              <option value="5">⭐ 5점</option>
            </select>
          </div>
          <div id="pickResult" class="pick-result-wrap" hidden></div>
        </section>

        <div class="home-pick-actions">
          <button type="button" id="btnGoList" class="btn btn-blue btn-block">
            식당 목록 및 추가
          </button>
        </div>

        <div id="homeListBlock" class="home-list-block" hidden>
          <section class="card">
            <div class="card-head">
              <h2>식당 목록</h2>
              <div class="card-head-actions list-card-head-actions">
                <button type="button" id="btnSyncNaver" class="btn btn-ghost">
                  주변 식당 최신화
                </button>
                <button type="button" id="btnOpenAdd" class="btn btn-blue">
                  식당 추가
                </button>
                <button
                  type="button"
                  id="btnListSearch"
                  class="btn primary pick-head-btn"
                >
                  검색
                </button>
              </div>
            </div>
            <div class="pick-stack pick-filters-inset">
              <label class="field-label" for="filterDistance">도보 시간</label>
              <div class="pick-distance-row">
                <select id="filterDistance" class="pick-distance-select">
                  <option value="">제한 없음</option>
                  <option value="10">10분 미만</option>
                  <option value="20">20분 미만</option>
                  <option value="30">30분 미만</option>
                  <option value="gte30">30분 이상</option>
                </select>
                <label
                  class="pick-matjip-toggle toggle-stamp"
                  for="filterMatjipOnly"
                >
                  <input
                    type="checkbox"
                    id="filterMatjipOnly"
                    class="toggle-stamp__input"
                  />
                  <span class="toggle-stamp__face">
                    <span class="toggle-stamp__ring" aria-hidden="true"></span>
                    <span class="toggle-stamp__text">맛집</span>
                  </span>
                </label>
              </div>
              <label class="field-label" for="filterCat">음식 종류</label>
              <select id="filterCat" class="field-full">
                <option value="">전체에서 골라줘</option>
              </select>
              <label class="field-label" for="filterRating">별점</label>
              <select id="filterRating" class="field-full">
                <option value="">전체 (별점 무관)</option>
                <option value="1">⭐ 1점 이상</option>
                <option value="2">⭐ 2점 이상</option>
                <option value="3">⭐ 3점 이상</option>
                <option value="4">⭐ 4점 이상</option>
                <option value="5">⭐ 5점</option>
              </select>
            </div>
            <div class="list-browse-panel">
              <ul id="list" class="list"></ul>
              <p id="empty" class="muted empty-msg empty-msg--panel" hidden>
                아직 조건에 맞는 곳이 없어요. 식당 추가에서 등록해 보세요.
              </p>
              <nav
                id="listPager"
                class="list-pager"
                aria-label="목록 페이지"
                hidden
              ></nav>
              <p
                id="count"
                class="muted list-count-footer"
                aria-live="polite"
              ></p>
            </div>
          </section>
        </div>

        <footer class="footer">
          <span id="dbStatus" class="muted">DB 연결 확인 중…</span>
        </footer>
      </div>

      <!-- 수정: 동일 문서 안에서 뷰만 전환 -->
      <div id="viewEdit" class="view hidden">
        <header class="sub-hero">
          <button
            type="button"
            id="btnEditBack"
            class="btn btn-back"
            aria-label="뒤로"
          >
            ← 돌아가기
          </button>
          <h2 class="sub-title">맛집 수정</h2>
        </header>

        <section class="card">
          <form id="formEdit" class="form-add">
            <input type="hidden" name="id" id="editId" />
            <div class="grid">
              <div class="edit-matjip-row full">
                <label class="edit-matjip-toggle toggle-stamp" for="editMatjip">
                  <input
                    type="checkbox"
                    name="is_matjip"
                    id="editMatjip"
                    value="1"
                    class="toggle-stamp__input"
                  />
                  <span class="toggle-stamp__face">
                    <span class="toggle-stamp__ring" aria-hidden="true"></span>
                    <span class="toggle-stamp__text">맛집</span>
                  </span>
                </label>
              </div>
              <label class="full">
                식당이름
                <input
                  name="name"
                  id="editName"
                  class="input-required"
                  required
                  maxlength="120"
                  placeholder="예: OO국밥"
                  autocomplete="off"
                />
              </label>
              <label class="full form-rating-block">
                별점 (최대 5점)
                <div class="rating-row">
                  <div
                    id="editStarRow"
                    class="star-row"
                    role="group"
                    aria-label="별점 선택"
                  ></div>
                  <input
                    type="number"
                    name="rating"
                    id="editRatingNum"
                    class="rating-num-input"
                    min="1"
                    max="5"
                    step="1"
                    placeholder="1~5"
                  />
                </div>
                <p class="field-hint field-hint--compact">
                  4점 이상이면 맛집 자동 체크, 3점 이하면 해제됩니다.
                </p>
              </label>
              <label class="full">
                도보 (분)
                <input
                  name="walk_minutes"
                  id="editWalk"
                  class="input-required"
                  type="number"
                  required
                  min="0"
                  max="255"
                  placeholder="회사에서 걸어서"
                />
              </label>
              <label class="full">
                주소 / 위치
                <input
                  name="address"
                  id="editAddress"
                  maxlength="255"
                  placeholder="건물명, 골목 등"
                />
              </label>
              <label>
                음식 종류
                <select name="category" id="editCategory" class="filter-select">
                  <option value="기타">기타</option>
                </select>
              </label>
              <label class="full">
                메모
                <textarea
                  name="memo"
                  id="editMemo"
                  maxlength="500"
                  rows="2"
                  placeholder="메뉴 추천, 웨이팅 팁…"
                ></textarea>
              </label>
            </div>
            <button type="submit" class="btn btn-blue btn-block">저장</button>
          </form>
          <div class="edit-actions-below">
            <button
              type="button"
              id="btnEditDelete"
              class="btn danger btn-block"
            >
              삭제
            </button>
          </div>
        </section>
      </div>

      <!-- 추가 폼 -->
      <div id="viewAdd" class="view hidden">
        <header class="sub-hero">
          <button
            type="button"
            id="btnAddBack"
            class="btn btn-back"
            aria-label="뒤로"
          >
            ← 돌아가기
          </button>
          <h2 class="sub-title">식당 추가</h2>
          <p class="sub-tagline">동료들과 공유할 곳을 적어 주세요</p>
        </header>

        <section class="card">
          <form id="formAdd" class="form-add">
            <div class="grid">
              <div class="name-matjip-row full">
                <label class="name-matjip-name">
                  식당이름
                  <input
                    name="name"
                    class="input-required"
                    required
                    maxlength="120"
                    placeholder="예: OO국밥"
                    autocomplete="off"
                  />
                </label>
                <label class="name-matjip-toggle toggle-stamp" for="addMatjip">
                  <input
                    type="checkbox"
                    name="is_matjip"
                    id="addMatjip"
                    value="1"
                    class="toggle-stamp__input"
                  />
                  <span class="toggle-stamp__face">
                    <span class="toggle-stamp__ring" aria-hidden="true"></span>
                    <span class="toggle-stamp__text">맛집</span>
                  </span>
                </label>
              </div>
              <label class="full form-rating-block">
                별점 (최대 5점)
                <div class="rating-row">
                  <div
                    id="addStarRow"
                    class="star-row"
                    role="group"
                    aria-label="별점 선택"
                  ></div>
                  <input
                    type="number"
                    name="rating"
                    id="addRatingNum"
                    class="rating-num-input"
                    min="1"
                    max="5"
                    step="1"
                    placeholder="1~5"
                  />
                </div>
                <p class="field-hint field-hint--compact">
                  4점 이상이면 맛집 자동 체크, 3점 이하면 해제됩니다.
                </p>
              </label>
              <label class="full">
                도보 (분)
                <input
                  name="walk_minutes"
                  class="input-required"
                  type="number"
                  required
                  min="0"
                  max="255"
                  placeholder="회사에서 걸어서"
                />
              </label>
              <label class="full">
                주소 / 위치
                <input
                  name="address"
                  maxlength="255"
                  placeholder="건물명, 골목 등"
                />
              </label>
              <label>
                음식 종류
                <select name="category" id="addCategory" class="filter-select">
                  <option value="기타">기타</option>
                </select>
              </label>
              <label class="full">
                메모
                <textarea
                  name="memo"
                  maxlength="500"
                  rows="2"
                  placeholder="메뉴 추천, 웨이팅 팁…"
                ></textarea>
              </label>
            </div>
            <button type="submit" class="btn btn-blue btn-block">등록</button>
          </form>
        </section>
      </div>
    </div>
    <div
      id="syncLoadingOverlay"
      class="sync-loading-overlay"
      hidden
      aria-hidden="true"
      aria-busy="false"
    >
      <div class="sync-loading-card" role="status" aria-live="polite">
        <div class="sync-loading-logo" aria-hidden="true">
          <svg
            class="sync-mascot"
            viewBox="0 0 120 120"
            width="120"
            height="120"
            xmlns="http://www.w3.org/2000/svg"
          >
            <ellipse cx="60" cy="98" rx="38" ry="8" fill="#a16207" opacity="0.18" />
            <path
              d="M28 58c0-18 14-32 32-32s32 14 32 32v18c0 8-6 14-14 14H42c-8 0-14-6-14-14V58z"
              fill="#fde047"
              stroke="#ca8a04"
              stroke-width="3"
            />
            <path
              d="M34 52c6-10 16-14 26-14s20 4 26 14"
              fill="#fef9c3"
              stroke="#eab308"
              stroke-width="2"
              stroke-linecap="round"
            />
            <circle cx="48" cy="62" r="3.5" fill="#422006" />
            <circle cx="72" cy="62" r="3.5" fill="#422006" />
            <path
              d="M52 72q8 6 16 0"
              fill="none"
              stroke="#422006"
              stroke-width="2.5"
              stroke-linecap="round"
            />
            <ellipse cx="42" cy="68" rx="5" ry="3" fill="#fca5a5" opacity="0.55" />
            <ellipse cx="78" cy="68" rx="5" ry="3" fill="#fca5a5" opacity="0.55" />
            <rect x="18" y="28" width="6" height="44" rx="3" fill="#d97706" transform="rotate(-18 21 50)" />
            <rect x="96" y="28" width="6" height="44" rx="3" fill="#d97706" transform="rotate(18 99 50)" />
            <circle cx="88" cy="22" r="5" fill="#fef08a" stroke="#eab308" stroke-width="1.5" />
            <path
              d="M86 22l2 2 4-4"
              fill="none"
              stroke="#a16207"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <p class="sync-loading-brand">FindEat</p>
        <p id="syncLoadingMsg" class="sync-loading-msg">주변 식당 받는 중…</p>
        <div id="syncLoadingDots" class="sync-loading-dots" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <!-- 스크립트는 body 끝에 두어 DOM 파싱 후 실행됩니다. -->
    <script src="/app.js"></script>
  </body>
</html>
